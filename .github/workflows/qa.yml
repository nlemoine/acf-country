name: QA

on:
  push:
    branches:
      - 4.x
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-versions:
    name: PHP versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: versions
        uses: WyriHaximus/github-action-composer-php-versions-in-range@b1da538007a030a09a7d257bd3881829a3544882 # v2.1.0

  tests:
    needs: php-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Every PHP version allowed by the "php" constraint of composer.json.
        php: ${{ fromJson(needs.php-versions.outputs.version) }}
        experimental: [false]
        include:
          # Nightly build, allowed to fail.
          - php: '8.6'
            experimental: true
    name: Tests (PHP ${{ matrix.php }}${{ matrix.experimental && ', experimental' || '' }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          # Dependencies may not declare support for unreleased PHP versions yet.
          composer-options: ${{ matrix.experimental && '--ignore-platform-req=php+' || '' }}
      - run: composer test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # One process per integration, so one report each: Codecov merges them.
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite unit,core --coverage-clover build/coverage-core.xml
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite wpgraphql --coverage-clover build/coverage-wpgraphql.xml
        env:
          ACF_COUNTRY_TEST_INTEGRATION: wpgraphql
      - run: php -d pcov.enabled=1 vendor/bin/phpunit --testsuite admin-columns --coverage-clover build/coverage-admin-columns.xml
        env:
          ACF_COUNTRY_TEST_INTEGRATION: admin-columns
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage-core.xml,build/coverage-wpgraphql.xml,build/coverage-admin-columns.xml
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Check country data is up to date
        run: php bin/sync-country-data.php --check
      - run: composer phpstan
      - run: composer rector

  coding-standards:
    uses: inpsyde/reusable-workflows/.github/workflows/coding-standards-php.yml@236c6b5a7fea73b5058b6f11bd17ff4b80994e54  # main as of 2026-09-28
    with:
      PHP_VERSION: '8.2'
